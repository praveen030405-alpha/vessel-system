[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["vessel_system*", "api*"]


[project]
name = "vessel-system"
version = "1.0.0"
description = "Vessel System - Production-Grade Personal Evolution & Capability System"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3.0",
    "firebase-admin>=7.7.0",
    "fastapi>=0.115.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "starlette>=0.45.0",
    "uvicorn>=0.34.0",
    "python-dotenv>=1.0.1",
    "google-cloud-firestore>=2.20.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.28.0"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
